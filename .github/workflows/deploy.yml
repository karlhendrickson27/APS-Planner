name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run typecheck:worker
      - run: npm run test:worker
      # GitHub's ubuntu-latest runners come with Google Chrome (the real
      # browser, not Playwright's own bundled Chromium) pre-installed,
      # with its own apt source configured. We never use it — only
      # Playwright's Chromium — but `apt-get update` below still queries
      # every configured source on the machine regardless, including that
      # unrelated one. When Google's own mirror has a sync hiccup (seen
      # directly: a Hash Sum mismatch on dl.google.com that persisted for
      # 20+ minutes), that unrelated failure was aborting an install that
      # needed nothing from it. Removing the source we don't use avoids
      # depending on infrastructure this pipeline has no actual need for.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list*
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      # Only what the browser actually needs — npm ci leaves node_modules/
      # sitting right here in the working directory, and unlike the old
      # "legacy" branch-serve mode (which only ever saw git-tracked files),
      # a literal `path: '.'` at this point would sweep that up too.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html version.txt sw.js manifest.webmanifest _site/
          cp -r assets _site/
          cp -r dist _site/
          cp -r status _site/
          cp -r privacy _site/
      # Stamp this build into the page. The bundle URL gets ?v=<version>, so a
      # reload always fetches the new code instead of the copy Pages lets
      # browsers cache for 10 minutes. APP_VERSION and version.txt get the
      # same value, so the "newer version" banner (src/app/version-check.ts)
      # works without anyone bumping a number by hand.
      - name: Stamp the version
        run: |
          V="$(date -u +%Y-%m-%d).${GITHUB_SHA::7}"
          sed -i "s#src=\"dist/app.bundle.js\"#src=\"dist/app.bundle.js?v=$V\"#" _site/index.html
          sed -i "s#^const APP_VERSION = .*;#const APP_VERSION = '$V';#" _site/index.html
          echo "$V" > _site/version.txt
          grep -q "app.bundle.js?v=$V" _site/index.html
          grep -q "const APP_VERSION = '$V';" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
